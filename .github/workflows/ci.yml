name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 for all actions now, ahead of the June 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ------------------------------------------------------------------
  # Matrix build: compile + unit tests on every supported JDK tier
  # Java 21 = LTS baseline (Virtual Threads GA, synchronized pins carriers)
  # Java 24 = JEP 491 landed (synchronized no longer pins carriers)
  # ------------------------------------------------------------------
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.java }}-

      - name: Build and test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: build/reports/tests/test/

  # ------------------------------------------------------------------
  # Pinning smoke test — runs the simulation harness with
  # -Djdk.tracePinnedThreads=full and fails the build if any
  # "reason:MONITOR" trace appears in the output.
  #
  # "reason:MONITOR" is emitted by the JVM whenever a Virtual Thread
  # is pinned to its OS carrier by a synchronized monitor — the exact
  # class of pinning this library is designed to eliminate.
  #
  # Only meaningful on Java 21–23 (pre-JEP 491). We keep it in CI so
  # any accidental regression (e.g., a dependency that adds a sync block
  # in a hot path) is caught immediately.
  # ------------------------------------------------------------------
  pinning-smoke-test:
    name: Pinning smoke test (Java 21)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-21-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-21-

      - name: Run simulation with carrier-pinning trace enabled
        run: |
          ./gradlew run \
            --jvm-args="-Djdk.tracePinnedThreads=full" \
            --no-daemon \
            2>&1 | tee /tmp/pinning-trace.txt || true

      - name: Assert no carrier-thread pinning (reason:MONITOR)
        run: |
          echo "--- Checking for reason:MONITOR in trace output ---"
          if grep -q "reason:MONITOR" /tmp/pinning-trace.txt; then
            echo ""
            echo "FAIL: Carrier-thread pinning detected!"
            echo "A synchronized monitor is being held by a Virtual Thread on a hot path."
            echo "Offending traces:"
            grep -A 10 "reason:MONITOR" /tmp/pinning-trace.txt
            exit 1
          fi
          echo "PASS: No carrier-thread pinning detected."
