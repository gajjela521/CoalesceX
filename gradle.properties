# CoalesceX — Gradle project properties
#
# -----------------------------------------------------------------------
# SENSITIVE CREDENTIALS — DO NOT PUT REAL VALUES IN THIS FILE.
# Store actual credentials in ~/.gradle/gradle.properties (never committed)
# or as GitHub Actions repository secrets (for CI releases).
# -----------------------------------------------------------------------
#
# Maven Central (central.sonatype.com)
#   1. Log in to https://central.sonatype.com
#   2. Account → Generate User Token
#   3. Copy the generated username + password below
#
# mavenCentralUsername=
# mavenCentralPassword=
#
# -----------------------------------------------------------------------
# GPG Signing — in-memory key (recommended for CI)
#   Export your secret key:
#     gpg --export-secret-keys --armor YOUR_KEY_ID | base64 -w0
#   Use the base64 output as signingInMemoryKey.
#
# signingInMemoryKey=
# signingInMemoryKeyPassword=
# -----------------------------------------------------------------------
#
# GPG Signing — keyring file (alternative for local development)
#   signing.keyId=          (last 8 hex chars of your key ID)
#   signing.password=
#   signing.secretKeyRingFile=  (absolute path to ~/.gnupg/secring.gpg)
